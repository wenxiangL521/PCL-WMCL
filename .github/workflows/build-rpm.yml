name: build-rpm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 release 标签（例如 v0.2.0）
        required: true

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          bash scripts/package-rpm.sh "$VERSION" 1 linux-x64

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" artifacts/*.rpm artifacts/*.rpm.sha256 --clobber

name: build-rpm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 release 标签（例如 v0.2.0）
        required: true
  # 也可以推送 rpm-vX.Y.Z 标签触发，避免需要 actions:write 权限
  push:
    tags:
      - 'rpm-v*'

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve target tag
        id: target
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME#rpm-}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM
        run: bash scripts/package-rpm.sh "${{ steps.target.outputs.version }}" 1 linux-x64

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.target.outputs.tag }}" artifacts/*.rpm artifacts/*.rpm.sha256 --clobber

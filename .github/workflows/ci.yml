name: build

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format whitespace WMCL.slnx --verify-no-changes --no-restore
      - name: Test
        run: dotnet test -c Release --nologo
      - name: Publish Linux single-file
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet publish src/WMCL.App/WMCL.App.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

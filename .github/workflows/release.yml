name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 单元测试在部分平台上依赖动画时序，暂不进入发布流水线；发布前本地跑全量。
      - name: Build
        run: dotnet build WMCL.slnx -c Release --nologo

  package-linux:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package Linux tar.gz
        run: bash scripts/package-linux.sh "${{ github.ref_name }}" linux-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          retention-days: 5

  package-windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows single-file
        run: >
          dotnet publish src/WMCL.App/WMCL.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o dist/win-x64
      - name: Rename and hash
        shell: pwsh
        run: |
          Move-Item dist/win-x64/WMCL.App.exe "dist/win-x64/WMCL.exe" -Force
          $hash = (Get-FileHash "dist/win-x64/WMCL.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  WMCL.exe" | Out-File -Encoding ascii "dist/win-x64/WMCL.exe.sha256"
          Get-Content "dist/win-x64/WMCL.exe.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            dist/win-x64/WMCL.exe
            dist/win-x64/WMCL.exe.sha256
          retention-days: 5

  package-macos:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish macOS single-file
        run: >
          dotnet publish src/WMCL.App/WMCL.App.csproj
          -c Release -r osx-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o dist/osx-x64
      - name: Package and hash
        run: |
          cd dist/osx-x64
          mv WMCL.App WMCL
          chmod +x WMCL
          tar -czf "../PCL-WMCL-osx-x64-${{ github.ref_name }}.tar.gz" WMCL
          cd ..
          shasum -a 256 "PCL-WMCL-osx-x64-${{ github.ref_name }}.tar.gz" > "PCL-WMCL-osx-x64-${{ github.ref_name }}.tar.gz.sha256"
          cat "PCL-WMCL-osx-x64-${{ github.ref_name }}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osx-x64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 5

  publish-release:
    needs: [package-linux, package-windows, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.exe' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*

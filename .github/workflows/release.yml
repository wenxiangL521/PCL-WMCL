name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd

      - name: Inject built-in secrets
        env:
          MS_CLIENT_ID: ${{ secrets.WMCL_MS_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.WMCL_CURSEFORGE_API_KEY }}
        run: |
          cat > secrets.local.props <<PROPS
          <Project>
            <PropertyGroup>
              <WmclMsClientId>${MS_CLIENT_ID}</WmclMsClientId>
              <WmclCurseForgeApiKey>${CF_API_KEY}</WmclCurseForgeApiKey>
            </PropertyGroup>
          </Project>
          PROPS

      - name: Build all artifacts
        run: bash scripts/make-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=(
            artifacts/WMCL.exe
            artifacts/PCL-WMCL-linux-x64-*.tar.gz
            artifacts/PCL-WMCL-linux-*-amd64.deb
            artifacts/pcl-wmcl-bin-*.pkg.tar.zst
            artifacts/pcl-wmcl-*.rpm
            artifacts/SHA256SUMS
          )
          # 允许重跑：Release 已存在时改为覆盖上传，而不是创建失败
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Plain Craft Launcher (PCL) WMCL ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${FILES[@]}"
          fi
